<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141414" />
<meta name="description" content="Kush Games — a Netflix-style arcade of browser games." />
<title>Kush Games</title>
<link rel="icon" id="favicon-png" href="/favicon-32.png?v=3" type="image/png" sizes="32x32" />
<link rel="icon" id="favicon-svg" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" id="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
<!-- Apply a saved colour theme before the first paint (no red flash): data-theme, the browser UI colour and the matching
     favicon files (favicon-lagoon.svg …). Same key and envelope as src/theme.ts; runs after the icon links exist. -->
<script>try{var s=JSON.parse(localStorage.getItem('kush-games:theme:save:v1'));if(s&&s.version===1&&s.data&&s.data.theme==='lagoon'){document.documentElement.setAttribute('data-theme','lagoon');document.querySelector('meta[name="theme-color"]').setAttribute('content','#163235');['favicon-png','favicon-svg','apple-touch-icon'].forEach(function(id){var l=document.getElementById(id);l.href=l.href.replace(/\/(favicon|apple-touch-icon)([.-])/,'/$1-lagoon$2')})}}catch(e){}</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
