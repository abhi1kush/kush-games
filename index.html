<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141414" />
<meta name="description" content="Kush Games — a Netflix-style arcade of browser games." />
<title>Kush Games</title>
<!-- Apply a saved colour theme before the first paint (no red flash). Same key and envelope as src/theme.ts. -->
<script>try{var s=JSON.parse(localStorage.getItem('kush-games:theme:save:v1'));if(s&&s.version===1&&s.data&&s.data.theme==='lagoon'){document.documentElement.setAttribute('data-theme','lagoon');document.querySelector('meta[name="theme-color"]').setAttribute('content','#163235')}}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e50914'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>K</text></svg>" />
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
