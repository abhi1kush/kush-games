# One small crate per game, so each game downloads only its own .wasm when it opens.
[workspace]
members = ["breakout", "connect_four", "checkers", "kush_jump", "jungle_strike", "antariksh_defenders", "mithai_match", "ludo", "snakes_ladders", "fleet_clash", "carrom", "jal_path", "paani_pour"]
resolver = "2"

[workspace.dependencies]
wasm-bindgen = { version = "0.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
