# One small crate per game, so each game downloads only its own .wasm when it opens.
[workspace]
members = ["breakout", "connect_four", "solitaire", "checkers"]
resolver = "2"

[workspace.dependencies]
wasm-bindgen = { version = "0.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
